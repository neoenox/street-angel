<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ストリートエンジェル — キャラクター比較</title><style>body{background:#11101b;color:#eee;font:16px system-ui;margin:24px auto;max-width:1100px;padding:0 16px}h1{font-size:26px}p{color:#bcb8ca}button,select{font:inherit;background:#292537;color:#fff;border:1px solid #73677e;padding:12px;margin:4px;border-radius:6px}canvas{width:100%;background:#201c2d;border:1px solid #63576f}a{color:#ffcb64}</style><h1>葵と黒蛇会</h1><p>同じ足元の線で、体格と構えを比較。向きや動きを切り替えられます。</p><label>動き <select id="pose"><option value="idle">構え</option><option value="walk">歩き</option><option value="attack">攻撃</option><option value="restrain">拘束</option><option value="escape">拘束から脱出</option><option value="assist">追加拘束・腹パン4回</option><option value="hurt">被弾</option><option value="down">倒れる</option><option value="getup">起き上がる</option><option value="rush">ボス：突進</option><option value="slam">ボス：叩きつけ</option></select></label><button id="flip">向きを変える</button><button id="play">停止</button><button id="step">少し進める</button><canvas id="lineup" width="1100" height="470" aria-label="キャラクター5人の比較"></canvas><p>葵：軽快な連打 ／ チンピラ：前のめりの拳 ／ ヤンキー：間合いの長い蹴り ／ 大男：重い一撃 ／ 剛田：長ラン姿の突進・叩きつけ</p><a href="street-angel.html">ゲームへ</a><script src="assets/characters/aoi_assist_v1.js"></script><script src="assets/characters/thug_assist_v1.js?v=2"></script><script src="assets/characters/yankee_assist_v1.js?v=2"></script><script src="assets/characters/brute_assist_v1.js"></script><script src="assets/characters/aoi_restraint_v3.js"></script><script src="assets/characters/thug_restraint_v2.js"></script><script src="assets/characters/yankee_restraint_v2.js?v=2"></script><script src="assets/characters/brute_restraint_v2.js"></script><script src="visual-style.js?v=2"></script><script src="assets/aoi_hit.js"></script><script src="character-motion.js?v=9"></script><script src="sprite-scale.js?v=1"></script><script src="assets/br_walk.js?v=2"></script><script src="assets/br_cmb.js?v=2"></script><script src="assets/thug_walk.js"></script><script src="assets/yk_walk.js?v=2"></script><script src="assets/aoi_walk4.js"></script><script src="assets/characters/aoi_attack_v2.js"></script><script src="assets/characters/thug_combat_v2.js"></script><script src="assets/characters/yankee_combat_v2.js?v=2"></script><script src="assets/characters/boss_motion_v2.js"></script><script src="assets/characters/boss_combat_v2.js"></script><script>
const c=document.getElementById('lineup'),g=c.getContext('2d'),select=document.getElementById('pose');
const defs=[
 ['aoi','葵',1,1,['aoi_walk4','characters/aoi_attack_v2','aoi_hit'],['SPR_WALK4','SPR_AOI_ATK_V2','SPR_HIT'],[0,1,2,3,4,6,8,9]],
 ['thug','チンピラ',1,1,['thug_walk','characters/thug_combat_v2'],['SPR_THUGW','SPR_THUGC_V2'],[0,1,2,3,4,6,8,9]],
 ['yankee','ヤンキー',1,.88,['yk_walk','characters/yankee_combat_v2'],['SPR_YKW','SPR_YKC_V2'],[11,0,2,1,3,4,5,8,7,9]],
 ['brute','大男',1.12,1,['br_walk','br_cmb'],['SPR_BRW','SPR_BRC'],[0,1,3,5,6,7,9]],
 ['boss','剛田',1.28,1,['characters/boss_motion_v2','characters/boss_combat_v2'],['SPR_BOSSM_V2','SPR_BOSSC_V2'],[0,1,2,3]],
];
for(const d of defs){if(d[0]==='boss')continue;d[4].push('characters/'+d[0]+'_restraint_'+(d[0]==='aoi'?'v3':'v2'));d[5].push('SPR_'+d[0].toUpperCase()+'_RESTRAINT');d[4].push('characters/'+d[0]+'_assist_v1');d[5].push('SPR_'+d[0].toUpperCase()+'_ASSIST')}let frame=0,playing=true,face=1;const imgs=defs.map((d,n)=>d[4].map((src,sheet)=>{const im=new Image();im.onload=()=>{if(d[0]!=='yankee')return;const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const ctx=c.getContext('2d');ctx.drawImage(im,0,0);const p=ctx.getImageData(0,0,c.width,c.height);shiftClothingPixels(p.data,'yankee',0);ctx.putImageData(p,0,0);imgs[n][sheet]=c};im.src='assets/'+src+'.png'+(src.includes('_assist_')?'?v=2':d[0]==='yankee'?'?v=2':'');return im}));
function render(){g.clearRect(0,0,c.width,c.height);g.fillStyle='#ffcb64';g.fillRect(20,340,1060,1);g.font='bold 22px system-ui';g.textAlign='center';
 defs.forEach((d,n)=>{const [key,label,scale,k,,data,walk]=d;const x=110+n*220,mode=select.value;let sheet=1,i=0;const t=frame%(mode==='assist'?ASSIST_TIMING.end:54);
 if(mode==='assist'&&key!=='boss'){sheet=data.length-1;i=assistFrame(key==='aoi'?{state:'restrained',assistedBy:{t}}:{state:'assisting',t})}
 else if((mode==='restrain'||mode==='escape')&&key!=='boss'){sheet=data.length-2;i=mode==='escape'?3:1}
 else if(mode==='walk'){sheet=0;i=walk[Math.floor(frame/9)%walk.length]}
 else if(key==='aoi'){i=mode==='attack'?playerAttackFrame('kick',t,9,16):playerIdleFrame();if(mode==='hurt'){sheet=2;i=t/54<.4?0:t/54<.75?1:2}else if(mode==='down'){sheet=2;i=t<12?4:t<25?5:t<30?6:7}else if(mode==='getup'){sheet=2;i=t/54<.18?8:t/54<.5?9:t/54<.8?10:11}}
 else {const state=mode==='rush'||mode==='slam'?(t<20?'windup':'attack'):mode;const a={n:mode,hs:10,he:22,dur:54};const p=enemyPose({styKey:key,state,atk:a,t:mode==='rush'||mode==='slam'?Math.max(0,t-20):t,z:mode==='down'&&t<25?20:0,vz:t<12?3:-3,lt:t-25,stun:54});sheet=p.sheet;i=p.frame}
 const im=imgs[n][sheet],f=window[data[sheet]].frames[i];if((im.complete&&im.naturalWidth)||im instanceof HTMLCanvasElement){const s=.5*scale*spriteScale(d[4][sheet]);g.save();g.translate(x,340);const sway=restraintSway({styKey:key,state:mode==='restrain'||mode==='assist'?'restrained':mode,t:frame,face});if(sway)g.translate(sway*scale,0);g.scale(spriteFacing(key,sheet,i,face)*CHARACTER_PROFILES[key].width,characterBreath(key,frame,mode));g.drawImage(im,f.x,f.y,f.w,f.h,-f.ax*s,-f.ay*s,f.w*s,f.h*s);g.restore()}
 g.fillStyle='#eee';g.fillText(label,x,390);
 });g.fillStyle='#bcb8ca';g.font='14px system-ui';g.fillText('← 共通の接地線 →',550,440)}
function tick(){if(playing)frame++;render();requestAnimationFrame(tick)}tick();
document.getElementById('flip').onclick=()=>{face*=-1;render()};document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'停止':'再生'};document.getElementById('step').onclick=()=>{playing=false;document.getElementById('play').textContent='再生';frame+=9;render()};select.onchange=()=>{frame=0;render()};
</script></html>
