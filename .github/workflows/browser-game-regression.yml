name: Browser game regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run browser-game logic tests
        run: node --test tests/*.test.cjs

  python-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'Pillow>=10,<13' 'scipy>=1.11,<2'
      - name: Verify image packing and audio asset integrity
        run: python -m unittest discover -s tests -p 'test_*.py' -v
