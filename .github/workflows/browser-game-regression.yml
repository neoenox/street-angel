name: Browser game regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run browser-game logic tests
        run: node --test tests/*.test.cjs

  python-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install image-test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'Pillow>=10,<13' 'scipy>=1.11,<2'
      - name: Verify image packing and audio asset integrity
        run: python -m unittest discover -s tests -p 'test_*.py' -v
