<style>
/* Layout: one 16:9 canvas centred on a dark stage, controls strip underneath */
:root{
  --bg:#0e0a16;
  --panel:#1a1426;
  --fg:#f6efe4;
  --muted:#a89cb8;
  --accent:#ff3d6e;
  --accent2:#ffc247;
  color-scheme:dark;
}
html{min-height:100%}
body{background:var(--bg);color:var(--fg);margin:0;padding-inline:16px;padding-block:12px;box-sizing:border-box;
  min-height:100svh;font-family:"Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#wrap{width:min(100%,calc((100svh - 90px)*16/9));min-width:0}
canvas{display:block;box-sizing:border-box;width:100%;aspect-ratio:16/9;background:#000;border:2px solid var(--panel);border-radius:4px;image-rendering:auto}
canvas:focus-visible,button:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
#orientation-hint{display:none;margin:0;color:#d5c8d8;font-size:14px;line-height:1.7;text-align:center}
#orientation-hint strong{display:block;color:var(--fg);font-size:18px}
#compact-hud{display:none;width:100%;max-width:560px;box-sizing:border-box;background:var(--panel);border:1px solid #443047;padding:10px 12px;gap:8px;font-size:14px}
#compact-hud[hidden]{display:none}
.hud-row{display:flex;align-items:center;gap:8px}.hud-row label{min-width:2em;color:#d7cde6}
.hud-row meter{flex:1;min-width:40px;height:14px;accent-color:var(--accent2)}
.hud-row meter::-webkit-meter-bar{background:#30263c;border:0;border-radius:3px}
.hud-row meter::-webkit-meter-optimum-value{background:#ffc247}
#compact-sp::-webkit-meter-optimum-value{background:#75bfff}
.hud-row meter::-moz-meter-bar{background:#ffc247}
#compact-sp::-moz-meter-bar{background:#75bfff}
.hud-row output{min-width:3em;text-align:right;font-variant-numeric:tabular-nums}
#compact-sp{accent-color:#75bfff}.hud-meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#d7cde6}
#help{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;font-size:13px;color:var(--muted);margin:0;padding:0;list-style:none}
#tp{display:none;width:min(100%,640px);justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
#tp .dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:6px}
#tp [data-k=ArrowUp]{grid-column:2;grid-row:1}
#tp [data-k=ArrowLeft]{grid-column:1;grid-row:2}
#tp [data-k=ArrowDown]{grid-column:2;grid-row:2}
#tp [data-k=ArrowRight]{grid-column:3;grid-row:2}
#tp .acts{display:grid;grid-template-columns:repeat(3,76px);gap:6px}
#tp button{font:700 15px "Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif;color:var(--fg);background:var(--panel);border:2px solid #3a2a4a;border-radius:10px;padding:0;min-height:58px;touch-action:none;-webkit-tap-highlight-color:transparent}
#tp button.on{background:var(--accent);border-color:var(--accent)}
@media (pointer:coarse){#tp{display:flex}#help{display:none}#wrap{width:min(100%,calc((100vh - 250px)*16/9))}}
@media (pointer:coarse) and (max-width:520px){#tp .dpad{grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,50px)}#tp .acts{grid-template-columns:repeat(3,58px)}#tp button{font-size:12px;min-height:48px}}
#help b{color:var(--accent2);font-weight:700;background:var(--panel);padding:1px 7px;border-radius:3px;margin-right:4px;font-family:ui-monospace,Consolas,monospace}
@media(max-width:600px){
  body{padding:18px 12px;justify-content:flex-start;gap:12px}
  #wrap{width:100%}#orientation-hint{display:block}#compact-hud:not([hidden]){display:grid}
  #help{font-size:13px;gap:9px 12px;line-height:1.8}
}
@media(pointer:coarse) and (max-width:370px){
  #tp{flex-wrap:nowrap;gap:12px}
  #tp .dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px}
  #tp .acts{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px}
  #tp button{font-size:11px;min-height:44px}
  #tp [data-k=Space]{font-size:10px}
}
@media(pointer:coarse) and (orientation:landscape) and (max-height:520px){
  body{padding:6px 10px;gap:6px;justify-content:center}
  #wrap{width:min(100%,calc((100svh - 124px)*16/9))}
  #orientation-hint,#compact-hud:not([hidden]){display:none}
  #tp{flex-wrap:nowrap;width:min(100%,640px);gap:16px}
  #tp .dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px}
  #tp .acts{grid-template-columns:repeat(3,66px);grid-template-rows:repeat(2,44px);gap:4px}
  #tp button{font-size:12px;min-height:44px}
}

<p id="orientation-hint"><strong>ストリートエンジェル 葵</strong>横向きにすると、キャラと攻撃が大きく見えます。</p>
<div id="compact-hud" aria-label="葵の状態" hidden>
  <div class="hud-meta"><span id="compact-stage">STAGE 1</span><span id="compact-lives">残機 3</span><span id="compact-score">0 pts</span></div>
  <div class="hud-row"><label for="compact-hp">体力</label><meter id="compact-hp" min="0" max="100" value="100"></meter><output id="compact-hp-text">100</output></div>

<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=960,H=540,Y0=384,Y1=506,GR=0.55;
const smallScreen=matchMedia('(max-width:600px)'),shortTouch=matchMedia('(pointer:coarse) and (orientation:landscape) and (max-height:520px)');
const compactHUD=document.getElementById('compact-hud');
const compactUI=Object.fromEntries(['stage','lives','score','hp','hp-text','sp','sp-text'].map(k=>[k,document.getElementById('compact-'+k)]));
function useCompactHUD(){return smallScreen.matches&&!shortTouch.matches}
function updateCompactHUD(){
  compactHUD.hidden=mode==='title';
  if(!useCompactHUD()||mode==='title')return;
  const values={stage:ST.name,lives:'残機 '+P.lives,score:score+' pts','hp-text':String(Math.ceil(P.hp)),'sp-text':P.meter>=50?'使用可':Math.floor(P.meter)+'%'};
  for(const [k,value] of Object.entries(values))if(compactUI[k].textContent!==value)compactUI[k].textContent=value;
  compactUI.hp.value=P.hp;compactUI.hp.max=P.maxhp;compactUI.sp.value=P.meter;
}
const FONT='"Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif';
const rand=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rand(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function mul(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- input ---------- */
let keys={},press={};
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(!keys[e.code])press[e.code]=true;keys[e.code]=true;audioInit();});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{keys={};press={};padHeld={}});
const dn=(...k)=>k.some(c=>keys[c]),hit=(...k)=>k.some(c=>press[c]);

/* ---------- audio ---------- */
let AC=null,muted=false;
const damageVoice=new AoiDamageVoice(()=>AC,()=>muted);
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();if(AC)damageVoice.warmup()}
function tone(f0,f1,d,type='square',v=.06){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d,v=.1){if(!AC||muted)return;const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),gn=AC.createGain();gn.gain.value=v;s.buffer=b;s.connect(gn);gn.connect(AC.destination);s.start()}
const sfx={swing:()=>tone(700,250,.07,'sawtooth',.03),punch:()=>{noise(.07,.12);tone(190,70,.09,'square',.08)},heavy:()=>{noise(.16,.2);tone(120,40,.2,'square',.12)},
  hurt:()=>{tone(300,120,.15,'sawtooth',.07)},jump:()=>tone(260,520,.12,'triangle',.06),land:()=>noise(.05,.05),pick:()=>{tone(660,990,.1,'triangle',.07);setTimeout(()=>tone(990,1320,.1,'triangle',.07),80)},
  special:()=>{tone(200,900,.35,'sawtooth',.06)},warn:()=>{tone(220,180,.4,'sawtooth',.1)},ko:()=>{tone(400,60,.5,'sawtooth',.1);noise(.3,.15)},clear:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,f,.2,'square',.06),i*120))}};

/* ---------- music: a small procedural chiptune loop per theme ---------- */
let MG=null,mus=null,musWant=null,noiseBuf=null;
const NOTE=m=>440*Math.pow(2,(m-69)/12);
function musOut(){if(!MG){MG=AC.createGain();MG.gain.value=.5;MG.connect(AC.destination)}return MG}
function blip(f,t,d,type,v){const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+.01);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(musOut());o.start(t);o.stop(t+d+.02)}
function hitNoise(t,d,v,hp){
  if(!noiseBuf){const n=AC.sampleRate;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1}
  const s2=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();s2.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;
  gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);s2.connect(f);f.connect(gn);gn.connect(musOut());s2.start(t);s2.stop(t+d+.02)}
function kickDrum(t){const o=AC.createOscillator(),gn=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);gn.gain.setValueAtTime(.4,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(gn);gn.connect(musOut());o.start(t);o.stop(t+.16)}
const MUS={
  title:{bpm:100,root:45,bass:[0,null,0,null,7,null,7,null,5,null,5,null,3,null,7,null],lead:[12,null,null,null,15,null,null,null,19,null,17,null,15,null,12,null,10,null,null,null,12,null,null,null,15,null,14,null,12,null,null,null],drums:false},
  dusk:{bpm:124,root:45,bass:[0,0,12,0,0,0,12,0,-4,-4,8,-4,-2,-2,10,-2],lead:[12,null,15,null,19,null,15,null,17,null,15,null,12,null,10,null,12,null,15,null,19,null,22,null,20,null,19,null,15,null,12,null],drums:true},
  night:{bpm:136,root:40,bass:[0,0,12,0,0,0,12,0,5,5,17,5,3,3,15,3],lead:[0,3,7,3,0,3,7,12,10,7,3,7,10,7,3,0,5,8,12,8,5,8,12,17,15,12,8,12,15,12,8,5],drums:true},
  hideout:{bpm:144,root:38,bass:[0,0,0,12,0,0,0,12,-2,-2,-2,10,-2,-2,-2,10],lead:[0,null,3,null,7,null,10,null,12,null,10,null,7,null,3,null,0,null,5,null,8,null,12,null,15,null,12,null,8,null,5,null],drums:true},
  boss:{bpm:164,root:43,bass:[0,0,0,0,12,0,12,0,-2,-2,-2,-2,10,-2,10,-2],lead:[0,3,7,10,12,10,7,3,0,3,7,10,12,15,12,10,-2,1,5,8,10,8,5,1,-4,-1,3,6,8,6,3,-1],drums:true}
};
function setMusic(name){mus=(name&&MUS[name]&&AC)?{name,th:MUS[name],step:0,next:AC.currentTime+.08}:null}
function stopMusic(){mus=null;musWant=null}
function scheduleMusic(){
  const m=mus,th=m.th,spb=60/th.bpm/2;
  if(m.next<AC.currentTime-.5)m.next=AC.currentTime+.05;      // caught up after a stall
  while(m.next<AC.currentTime+.3){
    const s2=m.step%32,t=m.next;
    const b=th.bass[s2%16];if(b!=null)blip(NOTE(th.root+b),t,spb*.95,'triangle',.22);
    const l=th.lead[s2];if(l!=null)blip(NOTE(th.root+12+l),t,spb*.85,'square',.05);
    if(th.drums){if(s2%4===0)kickDrum(t);if(s2%8===4)hitNoise(t,.12,.18,1200);if(s2%2===1)hitNoise(t,.03,.07,6000)}
    m.next+=spb;m.step++;
  }
}
const MUSIC=false;   // BGMはまだいらない: trueに戻すとテーマ曲(MUS)が鳴る
function musicUpdate(){
  if(!MUSIC||!AC||AC.state!=='running'||muted)return;
  let want=null;
  if(mode==='title')want='title';
  else if(mode==='play')want=enemies.some(e=>e.hp>0&&e.def&&e.def.boss)?'boss':(ST?ST.theme:null);
  if(want!==musWant){musWant=want;setMusic(want)}
  if(mus)scheduleMusic();
}

/* ---------- gamepad (standard layout) and touch buttons feed the same key table ---------- */
const PADBTN={0:'Space',1:'KeyX',2:'KeyZ',3:'KeyC',9:'Enter'};   // btn 9 (Start) doubles as KeyP below: Enter starts the game on title screens, KeyP toggles pause in play
let padHeld={};
function pollPad(){
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  const gp=[...pads].find(p=>p&&p.connected),now={};
  if(gp){
    const ax=gp.axes[0]||0,ay=gp.axes[1]||0,b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
    now.ArrowLeft=ax<-.45||b(14);now.ArrowRight=ax>.45||b(15);now.ArrowUp=ay<-.45||b(12);now.ArrowDown=ay>.45||b(13);
    for(const i in PADBTN)now[PADBTN[i]]=b(+i);
    now.KeyP=b(9);now.KeyM=b(8);
  }
  for(const c of new Set([...Object.keys(now),...Object.keys(padHeld)])){
    if(now[c]&&!padHeld[c]){keys[c]=true;press[c]=true;audioInit()}
    else if(!now[c]&&padHeld[c])keys[c]=false;
  }
  padHeld=now;
}
document.querySelectorAll('#tp [data-k]').forEach(btn=>{
  const c=btn.dataset.k;
  const down=e=>{e.preventDefault();if(!keys[c])press[c]=true;keys[c]=true;audioInit();btn.classList.add('on')};
  const up=e=>{e.preventDefault();keys[c]=false;btn.classList.remove('on')};
  btn.addEventListener('pointerdown',down);
  ['pointerup','pointercancel','pointerleave'].forEach(t=>btn.addEventListener(t,up));
  btn.addEventListener('contextmenu',e=>e.preventDefault());
});

};
const ET={
 thug:{name:'チンピラ',hp:36,spd:1.3,scale:1,sty:'thug',score:100,cd:[40,100],hold:[150,240],poise:0,
  atks:[{n:'jab',wind:18,dur:28,hs:5,he:11,dmg:6,reach:70,dt:22,kb:3,range:60,anim:'punchF',lunge:2.2,fr:.85,stun:16}]},
 yankee:{name:'ヤンキー',hp:30,spd:2.0,scale:1,sty:'yankee',score:150,cd:[30,80],hold:[130,210],poise:0,

    if(e.mountPlayer?.state==='mounted'&&list.includes(e.mountPlayer))return false;
    const p=e.heldPlayer||e.assistPlayer;
    return !(p?.state==='restrained'&&list.includes(p));
  }).sort((x,y)=>x.y-y.y);
  for(const root of roots){
    const group=root.state==='mounted'?[root,root.mountedBy].filter(e=>e&&list.includes(e)):root.state==='restrained'?[root.heldBy,root,root.assistedBy].filter(e=>e&&list.includes(e)):[root];
    for(const e of group){
      if(['mounted','mounting','mountCharge','mountTackle'].includes(e.state)&&drawMount(e))continue;
      if(drawRestraint(e))continue;
      if(hasSprite(e))e.styKey==='aoi'?drawSprite(e):drawEnemy(e);
      else drawPerson(e);
    }
    // Finish the linked group before drawing unrelated fighters in front.
    if(root.styKey==='aoi'&&root.state==='restrained'&&root.assistedBy)drawRestraint(root,true);
  }
  list.forEach(warn);
}

function shadow(e){const k=clamp(1-e.z/160,.3,1);g.fillStyle='rgba(0,0,0,'+.38*k+')';g.beginPath();g.ellipse(e.x-cam,e.y+2,(e.state==='down'||e.state==='dead'?48:28)*e.scale*k,8*e.scale,0,0,7);g.fill()}
function txt(s,x,y,sz,col,al='left',st=0,wt='bold'){g.font=wt+' '+sz+'px '+FONT;g.textAlign=al;g.textBaseline='alphabetic';if(st){g.lineWidth=st;g.strokeStyle='#120c1c';g.lineJoin='round';g.strokeText(s,x,y)}g.fillStyle=col;g.fillText(s,x,y)}

/* ---------- combat ---------- */
function strike(a,A,targets){
  if(a.t<A.hs||a.t>A.he)return;
  for(const t of targets){
    if(a.hitSet.has(t)||(t.hp<=0&&t.kind==='enemy'))continue;
    if((t.state==='down'&&!(t.kind==='player'&&t.defeated))||t.state==='dead'||t.state==='getup')continue;
    if(t.kind==='player'&&t.inv>0)continue;
    let dx=(t.x-a.x)*a.face;if(A.both)dx=Math.abs(t.x-a.x);
    if(dx<-10||dx>A.reach)continue;
    if(Math.abs(t.y-a.y)>(A.dt||24))continue;
    if(Math.abs(t.z-a.z)>58)continue;
    a.hitSet.add(t);
    if(A.n==='restrain'){EnemyRestraint.capture(a,t);continue}
    if(a.type==='thug'&&A.n==='jab'&&t.kind==='player'&&EnemyRestraint.capture(a,t))continue;
    damage(t,a,A);
  }
}
function spark(x,y,z,big){fx.push({k:'spark',x,y,z,life:big?14:9,max:big?14:9,big});for(let i=0;i<(big?7:3);i++)fx.push({k:'dot',x,y,z,vx:rand(-3,3),vz:rand(1,5),life:rand(10,20),col:pick(['#fff','#ffd95a','#ff7a4a'])})}
function damage(t,a,A){
  const mounted=t.kind==='player'&&t.state==='mounted'&&t.mountedBy;
  if(t.mountPlayer)EnemyMount.release(t.mountPlayer);
  if(t.mountedBy&&!mounted)EnemyMount.release(t);
  const held=t.kind==='player'&&t.state==='restrained'&&t.heldBy;
  if(t.heldBy&&!held)EnemyRestraint.release(t);
  if(t.heldPlayer)EnemyRestraint.release(t.heldPlayer);
  if(t.assistPlayer)EnemyRestraint.endAssist(t.assistPlayer);
  const dir=t.x>=a.x?1:-1;
  if(a.kind==='enemy'&&a.def.boss&&a.hp<a.maxhp*.5)A=Object.assign({},A,{dmg:A.dmg*1.25});
  t.hp-=A.dmg;t.flash=5;
  const big=!!A.down||(t.hp<=0&&!t.defeated);
  const mountK=mounted?spriteScale('characters/mount_v1'):1;
  freeze=Math.max(freeze,A.hitStop||(big?7:3));spark(A.n==='mountPunch'?t.x+t.face*66*mountK:A.n==='bellyHit'?t.x+t.face*12:(a.x+t.x)/2,t.y,t.z+(mounted?22*mountK:t.defeated&&!held?18:A.n==='bellyHit'?65:85),big);
  if(A.n==='bellyHit')shake=Math.max(shake,3);
  (big||A.heavy?sfx.heavy:sfx.punch)();
  let down=A.down||(t.hp<=0&&!t.defeated),stun=true;
  if(a.kind==='player'){
    combo++;comboT=80;a.meter=Math.min(100,a.meter+(A.multi?1.5:5));score+=A.dmg*5;lastTarget=t;lastTargetT=240;
    if(t.def&&t.def.heavy&&t.hp>0){t.poise-=A.dmg*(A.down?2:1);if(t.poise<=0){t.poise=t.def.poise}else{down=false;stun=false}}
    if(t.hp<=0){t.hp=0;score+=t.def.score;freeze=12;shake=10;sfx.ko();t.drop=t.def.boss?null:(t.type==='brute'||Math.random()<.18)?pick(['rice','rice','milk']):null;
      if(t.def.boss){freeze=40;shake=20;for(let i=0;i<30;i++)fx.push({k:'dot',x:t.x,y:t.y,z:t.z+40,vx:rand(-6,6),vz:rand(2,9),life:rand(20,40),col:pick(['#fff','#ffd95a','#ff3d6e'])})}}
  }else{
    a.hitSet.add(t);t.inv=0;combo=0;sfx.hurt();damageVoice.play(t.kind);t.meter=Math.min(100,t.meter+4);t.hurtN=(t.hurtN||0)+1;t.hurtT=0;
    if(t.hurtN>=3){down=true;t.hurtN=0;t.hurtT=null}
    if(t.hp<=0){t.hp=0}
  }
  if(held&&(t.hp>0||t.defeated)){t.vx=0;t.vz=0;t.hurtN=0;t.hurtT=null;return}
  if(mounted&&(t.hp>0||t.defeated)){t.vx=t.vz=0;t.hurtN=0;t.hurtT=null;return}
  if(mounted)EnemyMount.release(t);
  if(t.kind==='player'&&t.defeated){
    const hitDir=a.face===1||a.face===-1?a.face:dir;
    t.state='down';t.t=0;t.lt=8;t.vx=hitDir*clamp((A.kb||4)*.7,2,5);t.vz=A.down?4.2:3.2;
    t.atk=null;t.hurtN=0;t.hurtT=null;return;
  }
  if(held)EnemyRestraint.release(t);
  if(!stun){t.vx+=dir*.8;return}
  t.face=-dir;
  if(down){t.state='down';t.t=0;t.lt=0;t.vz=A.vz||5;t.vx=dir*(A.kb||5);t.atk=null;if(t.kind==='player'){t.inv=0;t.hurtN=0;t.hurtT=null}shake=Math.max(shake,6)}
  else{t.state='hurt';t.t=0;t.stun=A.stun||16;t.vx=dir*(A.kb||2.5);t.atk=null;if(t.kind==='player')t.inv=0}
}
function physics(e){
  if(e.z>0||e.vz!==0){e.vz-=GR;e.z+=e.vz;e.x+=e.vx;e.vx*=.985;
    if(e.z<=0){e.z=0;if(e.vz<-4){e.vz=-e.vz*.33;shake=Math.max(shake,4);for(let i=0;i<5;i++)fx.push({k:'dust',x:e.x,y:e.y,z:2,vx:rand(-2,2),vz:rand(0,1.5),life:18})}else e.vz=0}}
  else{e.x+=e.vx;e.vx*=.78;if(Math.abs(e.vx)<.05)e.vx=0}
}
function downLogic(e){
  physics(e);
  if(e.kind==='player'&&e.defeated){e.lt=Math.max(8,e.lt||0);return}
  if(e.z===0&&e.vz===0){e.lt++;
    if(e.kind==='player'&&e.hp>0)return; // Normal Aoi gets up only on fresh input.
    if(e.lt>(e.hp<=0&&!e.defeated?34:46)){
      if(e.hp<=0&&!e.defeated){e.state='dead';e.t=0}else{e.state='getup';e.t=0}
    }}
}
function startAtk(e,A){e.state='attack';e.atk=A;e.t=0;e.hitSet=new Set();sfx.swing()}

/* ---------- player ---------- */
function updPlayer(p){
  const dnP=(...k)=>!p.defeated&&dn(...k),hitP=(...k)=>!p.defeated&&hit(...k);
  p.t++;p.at++;if(p.inv>0)p.inv--;if(p.flash>0)p.flash--;if(p.landT>0)p.landT--;
  if(p.restraintExit>0)p.restraintExit--;
  if(p.restraintCooldown>0)p.restraintCooldown--;
  if(p.mountCooldown>0)p.mountCooldown--;
  if(p.hurtT!=null){p.hurtT++;if(p.hurtT>120){p.hurtN=0;p.hurtT=null}}   // juggle count expires after ~2s without a hit
  const ax=(dnP('ArrowRight','KeyD')?1:0)-(dnP('ArrowLeft','KeyA')?1:0),ay=(dnP('ArrowDown','KeyS')?1:0)-(dnP('ArrowUp','KeyW')?1:0);
  const atkP=hitP('KeyZ','KeyJ'),kickP=hitP('KeyX','KeyK'),jumpP=hitP('Space'),spP=hitP('KeyC','KeyL');
  switch(p.state){
    case'mounted':EnemyMount.escape(p,atkP||kickP||jumpP||spP);break;
    case'restrained':EnemyRestraint.tick(p,atkP||kickP||jumpP||spP);break;
    case'idle':case'walk':{
      if(p.comboT>0)p.comboT--;
      const sp=2.7;
      if(ax||ay){const n=Math.hypot(ax,ay);p.x+=ax/n*sp;p.y+=ay/n*sp*.72;if(ax)p.face=ax;p.state='walk';p.wp+=.2}else{if(p.state==='walk'){p.state='idle';p.t=0}}
      if(jumpP){p.state='jump';p.t=0;p.vz=9.6;p.jvx=ax*3;sfx.jump()}
      else if(spP&&p.meter>=50){p.meter-=50;startAtk(p,ATK.special);p.inv=ATK.special.dur+6;sfx.special();shake=6}
      else if(atkP){startAtk(p,ATK[p.comboT>0?p.chain:'p1']);p.buf=''}
      else if(kickP){startAtk(p,ATK.kick);p.buf=''}
      break}
    case'attack':{
      const A=p.atk;
      if(atkP)p.buf='p';if(kickP)p.buf='k';
      if(p.t===A.hs-1)p.vx=p.face*(A.step||0);
      if(A.both){p.vx=0}
      p.x+=p.vx;p.vx*=.8;
      if(A.multi){const ax2=(dn('ArrowRight','KeyD')?1:0)-(dn('ArrowLeft','KeyA')?1:0);p.x+=ax2*1.5;if(p.t%7===6)p.hitSet.clear()}
      strike(p,A,enemies);
      if(p.t>=A.dur||(A.cancel&&p.buf&&p.t>=A.he+3)){
        p.chain=A.next||'p1';
        if(p.buf==='p'&&A.next){startAtk(p,ATK[A.next]);p.buf=''}
        else if(p.buf==='k'){startAtk(p,ATK.kick);p.buf=''}
        else{p.state='idle';p.t=0;p.comboT=14;p.buf=''}
      }
      break}
    case'jump':case'jatk':{
      p.vz-=GR;p.z+=p.vz;p.x+=p.jvx+(p.state==='jatk'?p.face*1.6:0);p.y=clamp(p.y+ay*1.5,Y0,Y1);
      if(p.state==='jump'){if(ax)p.face=ax;if(atkP||kickP){p.state='jatk';p.atk=ATK.jkick;p.t=0;p.hitSet=new Set();sfx.swing()}}
      else strike(p,ATK.jkick,enemies);
      if(p.z<=0){p.landK=p.state==='jatk'?7:0;p.landT=6;p.z=0;p.vz=0;p.state='idle';p.t=0;p.vx=0;sfx.land();for(let i=0;i<4;i++)fx.push({k:'dust',x:p.x,y:p.y,z:2,vx:rand(-2,2),vz:rand(0,1),life:16})}
      break}
    case'hurt':p.x+=p.vx;p.vx*=.8;if(p.t>=p.stun){p.state='idle';p.t=0}break;
    case'down':downLogic(p);if(!p.defeated&&p.hp>0&&p.z===0&&p.vz===0&&hitP('ArrowRight','ArrowLeft','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS','KeyZ','KeyJ','KeyX','KeyK','Space','KeyC','KeyL')){p.state='getup';p.t=0}break;
    case'getup':if(p.t>=28){p.state='idle';p.t=0}break;
    case'dead':
      if(p.t>50){p.lives--;
        if(p.lives<=0){enterGameOver()}
        else{p.hp=p.maxhp;p.state='getup';p.t=0;p.inv=160;p.z=0;p.vz=0;p.x=clamp(p.x,cam+60,cam+W-60)}}

  }
  if(p.defeated||(p.state!=='down'&&p.state!=='dead')){p.x=clamp(p.x,cam+18,Math.min(cam+W-18,ST.len-18))}
  p.y=clamp(p.y,Y0,Y1);
  if(p.state==='down'||p.state==='dead')p.y=clamp(p.y,Y0,Y1);
}

/* ---------- enemies ---------- */
function tokens(){return enemies.filter(e=>e.hp>0&&['windup','attack','holding','assisting','mountCharge','mountTackle','mounting'].includes(e.state)).length}
/* returns true while the enemy is travelling; the caller maps it to walk/idle once, so the state no longer flaps every tick */
function steer(e,tx,ty,spd){const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);if(d>2){const m=Math.min(spd,d);e.x+=dx/d*m;e.y+=dy/d*m*.72;e.wp+=.11*spd;return true}return false}
function updEnemy(e){
  e.t++;e.at++;if(e.flash>0)e.flash--;
  if(e.restraintExit>0)e.restraintExit--;
  const p=P,def=e.def;
  // Another captor won the grab: restart as a normal attack with its own timing.
  if(p.heldBy&&p.heldBy!==e&&e.atk?.n==='restrain'&&(e.state==='windup'||e.state==='attack')){
    e.atk=pick(def.atks);e.state=e.atk.wind>0?'windup':'attack';e.t=0;e.hitSet=new Set();e.vx=0;
  }
  switch(e.state){
    case'idle':case'walk':{
      e.cd--;
      const dx=p.x-e.x;
      if(p.state!=='dead'){e.face=dx>=0?1:-1}
      let moved=false;
      if(!e.entered){moved=steer(e,p.x,p.y,def.spd*1.3);if(e.x>cam+30&&e.x<cam+W-30)e.entered=true}
      else if(p.state!=='dead'){
        const flank=enemyFlankTarget(e,p,enemies,cam+14,Math.min(cam+W-14,ST.len-14),Y0,Y1);
        if(flank){e.next=null;moved=steer(e,flank.x,flank.y,def.spd);e.state=moved?'walk':'idle';break}
        if(e.type==='thug'&&e.cd<=0&&tokens()<ST.tok&&Math.abs(dx)<170&&Math.abs(p.y-e.y)<18&&(p.state==='down'||(!e.next&&!EnemyRestraint.isBehind(e,p)&&Math.random()<.22))&&EnemyMount.start(e,p))break;
        if(EnemyRestraint.canAssist(e,p)&&e.cd<=0&&tokens()<ST.tok){
          e.next=null;
          const tx=p.x+p.face*EnemyRestraint.assistDistance(e);
          if(!EnemyRestraint.startAssist(e,p))moved=steer(e,tx,p.y,def.spd);
          if(e.state!=='assisting')e.state=moved?'walk':'idle';
          break;
        }
        if(e.next?.n==='restrain'&&(!EnemyRestraint.isBehind(e,p)||p.heldBy||p.restraintCooldown>0))e.next=null;
        const canGrab=!def.boss&&EnemyRestraint.isBehind(e,p)&&!p.heldBy&&!(p.restraintCooldown>0)&&(!p.defeated||p.z<=0);
        if(e.cd<=0&&!e.next)e.next=canGrab&&(e.type==='thug'||Math.random()<.25)?EnemyRestraint.attack:pick(def.atks);
        if(canGrab&&e.type==='thug'&&e.next?.n==='jab')e.next=EnemyRestraint.attack;
        if(e.next&&tokens()<ST.tok&&(p.defeated||p.state!=='down'||Math.random()<.02)){
          const A=e.next,tx=p.x-(dx>=0?1:-1)*A.range*.8;
          if(Math.abs(dx)<A.range&&Math.abs(p.y-e.y)<Math.min(16,A.dt*.6)){
            e.atk=A;e.state=A.wind>0?'windup':'attack';e.t=0;e.hitSet=new Set();e.next=null;
            if(A.n==='rush'||A.n==='slam')sfx.warn();
            if(e.state==='attack'){e.vx=e.face*(A.lunge||0);strike(e,A,[p])}
          }
          else moved=steer(e,tx,p.y,def.spd);
        }else{
          const flanking=e.flankUntil>e.at&&!p.defeated;
          const hx=flanking?p.x-p.face*68:p.x+e.side*e.hold,hy=flanking?p.y:p.y+Math.sin(e.at*.03+e.id)*38;
          if(Math.abs(hx-e.x)>14||Math.abs(hy-e.y)>10)moved=steer(e,hx,clamp(hy,Y0,Y1),def.spd*.8);
        }
      }
      if(e.state==='idle'||e.state==='walk')e.state=moved?'walk':'idle';
      break}
    case'windup':{
      e.face=(p.x>=e.x)?1:-1;
      if(e.t>=e.atk.wind){e.state='attack';e.t=0;e.vx=e.face*(e.atk.lunge||0);e.hitSet=new Set()}
      break}
    case'attack':{
      const A=e.atk;
      e.x+=e.vx;e.vx*=(A.fr||.85);
      if(A.slam&&e.t===A.hs){shake=12;sfx.heavy();for(let i=0;i<14;i++)fx.push({k:'dust',x:e.x+rand(-90,90),y:e.y+rand(-8,8),z:2,vx:rand(-3,3),vz:rand(1,3),life:24})}
      strike(e,A,[P]);
      if(e.state==='attack'&&e.t>=A.dur){e.state='idle';e.t=0;e.cd=ri(def.cd[0],def.cd[1])*(def.boss&&e.hp<e.maxhp*.5?.6:1);e.vx=0}
      break}
    case'mountCharge':case'mountTackle':EnemyMount.approach(e,p);break;
    case'mounting':EnemyMount.tick(e,p,damage);break;
    case'assisting':EnemyRestraint.tickAssist(e,p,damage);break;
    case'holding':{
      if(e.heldPlayer!==p||p.heldBy!==e||p.state!=='restrained'){if(e.heldPlayer)EnemyRestraint.release(e.heldPlayer);e.state='idle';e.cd=90;break}
      EnemyRestraint.align(e,p);e.vx=0;break}
    case'hurt':e.x+=e.vx;e.vx*=.8;if(e.t>=e.stun){e.state='idle';e.t=0;e.cd=ri(10,40);e.next=null}break;
    case'down':downLogic(e);break;
    case'getup':if(e.t>=28){e.state='idle';e.t=0;e.cd=ri(10,40);e.next=null}break;
    case'dead':if(e.t>60){e.rm=true;if(e.drop)items.push({k:e.drop,x:e.x,y:e.y,life:900})}break;
  }
  if(e.entered&&e.state!=='down'&&e.state!=='dead')e.x=clamp(e.x,cam+14,Math.min(cam+W-14,ST.len-14));
  e.y=clamp(e.y,Y0,Y1);
}

/* ---------- flow ---------- */
function enterGameOver(){
  if(P.mountedBy)EnemyMount.release(P);
  EnemyRestraint.release(P);
  mode='gameover';P.defeated=true;P.hp=0;P.lives=0;P.inv=0;
  P.state='down';P.t=0;P.lt=8;P.z=0;P.vx=0;P.vz=0;P.atk=null;P.buf='';
  P.x=clamp(P.x,cam+60,cam+W-60);
  banner=null;clearT=0;goT=0;freeze=0;combo=0;comboT=0;
  if(!enemies.some(e=>e.hp>0))enemies.push(mkEnemy('thug',P.x+100,P.y));
  sfx.ko();
}
function loadStage(i){
  if(P?.mountedBy)EnemyMount.release(P);
  if(P?.heldBy)EnemyRestraint.release(P);
  damageVoice.stop();
  stageIdx=i;ST=STAGES[i];BG=buildBG(ST);cam=0;limit=0;waveIdx=-1;waveActive=false;queue=[];enemies=[];items=[];fx=[];clearT=0;goT=0;
  P.x=80;P.y=450;P.state='idle';P.t=0;P.z=0;P.vz=0;P.vx=0;P.inv=60;
  banner={t:0,main:ST.name,sub:ST.title};
}
function startGame(){score=0;P=mkPlayer();combo=0;loadStage(0);mode='play';titleBG=null;titleP=null;titleT=null}   // free the title backdrop (~30MB of prerendered layers); drawTitle rebuilds it on return
function spawn(type){
  const side=Math.random()<.5&&cam>0?-1:1,x=side<0?cam-50:cam+W+50;
  if(side<0&&cam<=0){enemies.push(mkEnemy(type,cam+W+50,rand(Y0,Y1)));return}
  enemies.push(mkEnemy(type,x,rand(Y0,Y1)));
}
function updWaves(){
  const waves=ST.waves;
  if(!waveActive){
    if(waveIdx+1<waves.length){
      const nx=waves[waveIdx+1];limit=nx.x;
      if(cam>=nx.x-1){waveIdx++;waveActive=true;queue=nx.e.slice();spawnT=10;if(nx.boss){banner={t:0,main:'WARNING',sub:'黒蛇会の番長が現れた!',warn:true};sfx.warn()}}
    }else if(!clearT&&enemies.filter(e=>e.hp>0).length===0){clearT=1;sfx.clear()}
  }else{
    spawnT--;
    const alive=enemies.filter(e=>e.hp>0).length,cap=ST.tok+3;
    if(queue.length&&spawnT<=0&&alive<cap){spawn(queue.shift());spawnT=ri(30,60)}
    if(!queue.length&&enemies.filter(e=>e.hp>0).length===0){waveActive=false;goT=0;if(waveIdx+1<waves.length)limit=waves[waveIdx+1].x}
  }
  const target=P.x-W*.42;
  cam=Math.max(cam,Math.min(target,limit,ST.len-W));
}
function update(){
  frame++;
  if(hit('KeyM')){muted=!muted;if(muted){stopMusic();damageVoice.stop()}}
  if(mode==='title'){if(hit('Enter','KeyZ','KeyJ','Space')&&mayStart())startGame();return}
  if(mode==='win'){if(hit('Enter'))mode='title';return}
  if(mode==='gameover'&&hit('Enter')){damageVoice.stop();mode='title';paused=false;return}
  if(hit('KeyP','Escape')){paused=!paused;if(paused)damageVoice.stop()}
  if(paused)return;
  if(banner){banner.t++;if(banner.t>150)banner=null}
  if(freeze>0){
    if(P.state==='mounted')EnemyMount.escape(P,!P.defeated&&hit('KeyZ','KeyJ','KeyX','KeyK','Space','KeyC','KeyL'));
    if(P.state==='restrained')EnemyRestraint.tick(P,!P.defeated&&hit('KeyZ','KeyJ','KeyX','KeyK','Space','KeyC','KeyL'));
    freeze--;return;
  }
  if(shake>0)shake*=.86;if(shake<.3)shake=0;
  if(comboT>0){comboT--;if(comboT===0)combo=0}
  if(lastTargetT>0)lastTargetT--;
  updPlayer(P);
  for(const e of enemies)updEnemy(e);
  enemies=enemies.filter(e=>!e.rm);
  // separation
  for(let i=0;i<enemies.length;i++)for(let j=i+1;j<enemies.length;j++){const a=enemies[i],b=enemies[j];
    if(a.z>0||b.z>0||a.state==='mounting'||b.state==='mounting'||a.state==='holding'||b.state==='holding'||a.state==='assisting'||b.state==='assisting'||a.state==='down'||b.state==='down'||a.state==='dead'||b.state==='dead')continue;
    const dx=b.x-a.x,dy=b.y-a.y;if(Math.abs(dx)<30&&Math.abs(dy)<12){const s=dx>=0?1:-1;a.x-=s*.8;b.x+=s*.8;a.y-=dy>=0?.4:-.4;b.y+=dy>=0?.4:-.4}}
  // items
  for(const it of items){it.life--;if(mode!=='gameover'&&Math.hypot(it.x-P.x,(it.y-P.y)*1.6)<28&&P.state!=='dead'){
    if(it.k==='rice'){P.hp=Math.min(P.maxhp,P.hp+35)}else{P.hp=Math.min(P.maxhp,P.hp+15);P.meter=Math.min(100,P.meter+40)}
    it.life=0;sfx.pick();fx.push({k:'txt',x:P.x,y:P.y,z:90,vz:.8,life:50,s:it.k==='rice'?'HP +35':'HP +15 / SP +40',col:'#7dff9a'})}}
  items=items.filter(i=>i.life>0);
  // fx
  for(const f of fx){f.life--;if(f.k==='dot'||f.k==='dust'){f.x+=f.vx||0;f.z+=f.vz||0;if(f.k==='dot')f.vz-=.3;else f.vz*=.95}else if(f.k==='txt')f.z+=f.vz}
  fx=fx.filter(f=>f.life>0);
  if(mode==='gameover')return;
  updWaves();
  if(goT>=0&&!waveActive&&waveIdx+1<ST.waves.length)goT++;
  if(clearT){clearT++;if(clearT===200){score+=P.hp*10}
    if(clearT>360){if(stageIdx+1<STAGES.length)loadStage(stageIdx+1);else mode='win'}}
}

/* ---------- render ---------- */
function drawItem(it){
  const sx=it.x-cam,b=Math.sin(frame*.12)*2;
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(sx,it.y+2,12,4,0,0,7);g.fill();
  g.save();g.translate(sx,it.y-10+b);
  if(it.life<150&&Math.floor(frame/4)%2)g.globalAlpha=.4;
  if(it.k==='rice'){g.fillStyle='#fff';g.strokeStyle='#19121f';g.lineWidth=2;g.beginPath();g.moveTo(0,-14);g.lineTo(13,8);g.quadraticCurveTo(0,13,-13,8);g.closePath();g.fill();g.stroke();g.fillStyle='#1a2a24';g.fillRect(-6,1,12,9)}
  else{g.fillStyle='#fff';g.strokeStyle='#19121f';g.lineWidth=2;g.beginPath();g.rect(-8,-12,16,22);g.fill();g.stroke();g.fillStyle='#4aa3ff';g.fillRect(-8,-4,16,9);g.fillStyle='#fff';g.beginPath();g.moveTo(-8,-12);g.lineTo(0,-18);g.lineTo(8,-12);g.fill();g.stroke()}
  g.restore();
}
function drawFx(){
  for(const f of fx){const sx=f.x-cam,sy=f.y-(f.z||0);
    if(f.k==='spark'){const k=f.life/f.max,r=(f.big?34:20)*(1.2-k*.4);g.save();g.translate(sx,sy);g.rotate(f.life*.4);g.fillStyle=f.big?'#ffe27a':'#fff';g.globalAlpha=Math.min(1,k*1.5);
      g.beginPath();for(let i=0;i<16;i++){const rad=i%2?r*.35:r;const a=i/16*Math.PI*2;g.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}g.closePath();g.fill();g.restore()}
    else if(f.k==='dot'){g.fillStyle=f.col;g.globalAlpha=clamp(f.life/10,0,1);g.fillRect(sx-2,sy-2,4,4);g.globalAlpha=1}
    else if(f.k==='dust'){g.fillStyle='rgba(220,210,200,'+f.life/40+')';g.beginPath();g.arc(sx,sy,3+(24-f.life)*.2,0,7);g.fill()}
    else if(f.k==='txt'){txt(f.s,sx,sy,18,f.col,'center',4)}}
}
function bar(x,y,w,h,v,col1,col2,bg='#120c1c'){g.fillStyle=bg;g.fillRect(x-2,y-2,w+4,h+4);g.fillStyle='#3a2a44';g.fillRect(x,y,w,h);const gr=g.createLinearGradient(x,y,x,y+h);gr.addColorStop(0,col1);gr.addColorStop(1,col2);g.fillStyle=gr;g.fillRect(x,y,w*clamp(v,0,1),h)}
const PORT=new Image();PORT.src='assets/portrait.png';
function drawHUD(){
  if(P.state==='mounted'&&!P.defeated){txt('攻撃 / ジャンプ連打で脱出',W/2,H-78,20,'#ffe14f','center',4);bar(W/2-80,H-62,160,8,(P.escape||0)/8,'#ffe14f','#ff8b4a')}
  if(P.state==='down'&&P.hp>0&&!P.defeated)txt('ボタンを押して起き上がる',W/2,H-78,20,'#fff','center',4);
  if(P.state==='restrained'&&!P.defeated){
    txt('拘束中! 攻撃 / ジャンプ連打で脱出',W/2,H-78,20,'#ffe14f','center',4);
    bar(W/2-80,H-62,160,8,(P.escape||0)/8,'#ffe14f','#ff8b4a');
  }
  if(useCompactHUD()){
    // Status stays readable in HTML; reserve the small canvas for combat.
    if(lastTarget&&lastTargetT>0){txt(lastTarget.def.name,W-24,30,24,'#fff','right',4);bar(W-224,40,200,12,lastTarget.hp/lastTarget.maxhp,'#ff6a5a','#c4281c')}
    if(combo>=2)txt(combo+' HIT!',24,42,32,'#ffe14f','left',5);
  }else{
  // portrait (concept art crop, falls back to a flat circle while loading)
  g.fillStyle='#120c1c';g.beginPath();g.arc(44,44,32,0,7);g.fill();g.save();g.beginPath();g.arc(44,44,29,0,7);g.clip();
  if(PORT.complete&&PORT.naturalWidth)g.drawImage(PORT,10,10,68,68);else{g.fillStyle='#ff9ac0';g.fillRect(10,10,70,70)}
  g.restore();
  txt('葵',86,30,18,'#fff','left',4);txt('AOI',112,30,12,'#ffc247','left',3);
  bar(86,38,250,16,P.hp/P.maxhp,P.hp<30?'#ff6a5a':'#ffd24a',P.hp<30?'#c4281c':'#e88a1a');
  const full=P.meter>=50;bar(86,60,170,8,P.meter/100,full?'#9fe6ff':'#4aa3ff',full?'#3a8fff':'#2a5ccc');
  txt(full?'必殺 READY [C]':'SP',262,69,11,full?'#9fe6ff':'#a89cb8','left',3);
  for(let i=0;i<P.lives;i++){g.fillStyle='#ff3d6e';g.strokeStyle='#120c1c';g.lineWidth=2;const x=94+i*20,y=84;g.beginPath();g.moveTo(x,y+8);g.bezierCurveTo(x-12,y-2,x-4,y-10,x,y-3);g.bezierCurveTo(x+4,y-10,x+12,y-2,x,y+8);g.fill();g.stroke()}
  txt('SCORE',W-24,28,12,'#a89cb8','right',3);txt(String(score).padStart(7,'0'),W-24,52,28,'#fff','right',5);
  txt(ST.name,W-24,74,13,'#ffc247','right',3);
  if(lastTarget&&lastTargetT>0&&!lastTarget.def.boss){const t=lastTarget;txt(t.def.name,W-24,98,14,'#fff','right',3);bar(W-184,104,160,10,t.hp/t.maxhp,'#ff6a5a','#c4281c')}
  if(combo>=2){txt(combo+' HIT!',24,120,26+Math.min(10,combo),'#ffe14f','left',5)}
  }
  const boss=enemies.find(e=>e.def.boss&&e.hp>0);
  if(boss){txt(boss.def.name,W/2-220,H-40,useCompactHUD()?26:18,'#ffc247','left',4);bar(W/2-220,H-32,440,14,boss.hp/boss.maxhp,'#ff5a5a','#a01818')}
  if(goT>30&&Math.floor(goT/22)%2&&!waveActive&&!clearT){txt('GO',W-70,H/2-30,44,'#ffe14f','right',6);g.fillStyle='#ffe14f';g.strokeStyle='#120c1c';g.lineWidth=5;g.beginPath();g.moveTo(W-60,H/2-62);g.lineTo(W-26,H/2-44);g.lineTo(W-60,H/2-26);g.closePath();g.stroke();g.fill()}
}
function drawBanner(){
  if(!banner)return;const t=banner.t,a=t<20?t/20:t>120?Math.max(0,1-(t-120)/30):1;
  g.save();g.globalAlpha=a;
  g.fillStyle=banner.warn?'rgba(120,0,20,.65)':'rgba(10,6,20,.6)';g.fillRect(0,170,W,120);
  if(banner.warn&&Math.floor(t/8)%2){g.fillStyle='rgba(255,60,60,.25)';g.fillRect(0,170,W,120)}
  txt(banner.main,W/2,236,58,banner.warn?'#ff5a5a':'#ffc247','center',8);
  txt(banner.sub,W/2,272,22,'#fff','center',5);g.restore();
}
function render(){
  updateCompactHUD();
  if(cv.width!==W*2){cv.width=W*2;cv.height=H*2}
  g.setTransform(2,0,0,2,0,0);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
  g.save();
  if(shake>0)g.translate(rand(-shake,shake),rand(-shake,shake)*.6);
  if(mode==='title'){drawTitle();g.restore();return}
  drawBG();
  const list=[P,...enemies].sort((a,b)=>a.y-b.y);
  for(const it of items)drawItem(it);
  for(const e of list)shadow(e);
  drawCharacters(list);
  drawFx();
  g.restore();
  drawHUD();drawBanner();
  if(muted)txt('音 OFF [M]',W-24,H-14,12,'#a89cb8','right',3);
  if(clearT){const a=Math.min(1,clearT/30);g.globalAlpha=a;g.fillStyle='rgba(10,6,20,.6)';g.fillRect(0,150,W,180);
    txt(stageIdx+1<STAGES.length?'STAGE CLEAR!':'ALL CLEAR!!',W/2,225,56,'#ffc247','center',8);
    if(clearT>=100)txt('ボーナス  '+(P.hp*10)+' pts',W/2,275,24,'#fff','center',5);g.globalAlpha=1}
  if(paused){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,W,H);txt('PAUSE',W/2,H/2,56,'#fff','center',8);txt('P で再開',W/2,H/2+40,20,'#a89cb8','center',4)}
  if(mode==='gameover'){txt('GAME OVER',W/2,126,36,'#ff3d6e','center',6);txt('攻撃を受け続けるモード  /  Enter でタイトルへ',W/2,152,17,'#ffc247','center',4)}
  if(mode==='win'){g.fillStyle='rgba(0,0,0,.72)';g.fillRect(0,0,W,H);txt('黒蛇会、壊滅!',W/2,200,60,'#ffc247','center',8);txt('街に平和が戻った。葵は夕日の中、静かに歩き出す。',W/2,254,20,'#fff','center',4);txt('FINAL SCORE  '+score,W/2,320,34,'#fff','center',5);if(Math.floor(frame/30)%2)txt('Enter でタイトルへ',W/2,380,22,'#ffc247','center',4)}
}
let titleBG=null,titleP=null,titleT=null;
function drawTitle(){
  if(!titleBG){titleBG=buildBG(STAGES[0]);titleP=mkFighter({kind:'player',sty:STY.aoi,styKey:'aoi',x:300,y:470,face:1})}
  BG=titleBG;ST=STAGES[0];cam=(frame*.6)%1200;drawBG();
  g.fillStyle='rgba(10,6,20,.55)';g.fillRect(0,0,W,H);
  titleP.at=frame;titleP.state='idle';titleP.x=cam+250;shadow(titleP);
  if(!titleT)titleT=mkFighter({kind:'enemy',sty:STY.thug,styKey:'thug',x:0,y:476,face:-1,def:ET.thug});titleT.x=cam+700;titleT.at=frame+9;shadow(titleT);drawCharacters([titleP,titleT]);
  const y=Math.sin(frame*.05)*3;
  txt('ストリートエンジェル',W/2,150+y,64,'#fff','center',10);
  txt('葵',W/2,226+y,66,'#ff3d6e','center',10);
  txt('女子高生ファイター VS 黒蛇会',W/2,262,22,'#ffc247','center',5);
  if(!mayStart())txt('読み込み中…',W/2,334,28,'#ffc247','center',6);
  else if(Math.floor(frame/30)%2)txt('PRESS ENTER / Z',W/2,334,28,'#fff','center',6);
  txt('← ↑ ↓ → 移動   Z パンチ   X キック   Space ジャンプ   C 必殺技',W/2,H-30,16,'#d7cde6','center',4,'normal');
}

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function loop(now){
  acc+=Math.min(100,now-last);last=now;
  pollPad();
  while(acc>=1000/60){update();press={};acc-=1000/60}
  musicUpdate();render();requestAnimationFrame(loop);
}
/* Debug hooks are only exposed with ?debug (e.g. street-angel.html?debug) so production has no cheat/backdoor surface. */
if(/[?&]debug\b/.test(location.search))window.__game=()=>({mode,P,enemies,cam,ST,score,startGame,loadStage,dbg:{SPR,ESET,assetsReady,mayStart,damageVoice,r3d:()=>false},pollPad,keys:()=>keys,musicTest:()=>{const _AC=AC,_MG=MG,_nb=noiseBuf,_mus=mus;try{AC=new OfflineAudioContext(1,44100*3,44100);MG=null;noiseBuf=null;mus={name:'dusk',th:MUS.dusk,step:0,next:.05};scheduleMusic();const a=mus.step;mus={name:'boss',th:MUS.boss,step:0,next:.05};scheduleMusic();return[a,mus.step]}finally{AC=_AC;MG=_MG;noiseBuf=_nb;mus=_mus}},step:n=>{for(let i=0;i<n;i++){update();press={}}render()}});

requestAnimationFrame(loop);
})();
</script>
